<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">claude-jev-gate v0.2.1 — PermissionRequest tool gate and local Anthropic proxy</title>
  <desc id="desc">Monochrome hero for Claude Code: high-confidence Jev approve becomes allow once; otherwise human review. Optional local proxy hop for model route and trim-then-compress. Three switches default OFF.</desc>

  <rect width="1200" height="400" rx="28" fill="#0B0B0C"/>
  <rect x="0" y="0" width="6" height="400" fill="#F4F1EA"/>

  <!-- frame -->
  <rect x="40" y="28" width="1120" height="344" rx="4" fill="none" stroke="#2E2C2A" stroke-width="1"/>
  <line x1="40" y1="56" x2="1160" y2="56" stroke="#2E2C2A" stroke-width="1"/>
  <text x="56" y="48" fill="#5C5852" font-size="12" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GATE · PROXY · 3× OFF</text>
  <text x="1104" y="48" text-anchor="end" fill="#5C5852" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v0.2.1 · MIT</text>

  <!-- LEFT: title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <text x="64" y="100" fill="#8A857C" font-size="14" letter-spacing="1.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CLAUDE CODE · HOOK + LOCAL PROXY</text>
    <text x="64" y="158" fill="#F4F1EA" font-size="50" font-weight="700">claude-jev-gate</text>
    <text x="64" y="200" fill="#D4D0C8" font-size="20" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Noto Sans SC', sans-serif">高置信 approve → allow once</text>
    <text x="64" y="230" fill="#8A857C" font-size="18" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Noto Sans SC', sans-serif">可选本机代理：路由 + 先裁再压 · 三开关默认关</text>

    <g transform="translate(64 268)">
      <rect width="136" height="34" rx="6" fill="#161514" stroke="#F4F1EA" stroke-width="1.2"/>
      <text x="68" y="22" text-anchor="middle" fill="#F4F1EA" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">allow once</text>
      <rect x="148" width="152" height="34" rx="6" fill="#161514" stroke="#3A3836"/>
      <text x="224" y="22" text-anchor="middle" fill="#8A857C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">human review</text>
      <rect x="312" width="118" height="34" rx="6" fill="#161514" stroke="#3A3836"/>
      <text x="371" y="22" text-anchor="middle" fill="#8A857C" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3× OFF</text>
    </g>

    <text x="64" y="340" fill="#5C5852" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CI · .github/workflows/prove.yml · 4 prove exit 0</text>
  </g>

  <!-- RIGHT: permission + switches + proxy hop -->
  <g transform="translate(680 74)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="460" height="276" rx="12" fill="#161514" stroke="#2E2C2A"/>
    <rect width="460" height="38" rx="12" fill="#121110"/>
    <rect y="26" width="460" height="12" fill="#121110"/>
    <text x="18" y="24" fill="#8A857C" font-size="13" letter-spacing="1">PermissionRequest</text>
    <circle cx="420" cy="19" r="4.5" fill="#3A3836"/>
    <circle cx="438" cy="19" r="4.5" fill="#5C5852"/>

    <!-- decision row -->
    <g transform="translate(18 52)">
      <text x="0" y="0" fill="#5C5852" font-size="11" letter-spacing="1.4">JEV DECISION</text>
      <g transform="translate(0 12)">
        <rect width="196" height="64" rx="8" fill="#0B0B0C" stroke="#F4F1EA" stroke-width="1.5"/>
        <text x="14" y="26" fill="#F4F1EA" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">allow once</text>
        <text x="14" y="48" fill="#8A857C" font-size="13">high-conf approve</text>
      </g>
      <text x="210" y="48" fill="#5C5852" font-size="14">/</text>
      <g transform="translate(228 12)">
        <rect width="196" height="64" rx="8" fill="#0B0B0C" stroke="#3A3836" stroke-width="1.5"/>
        <text x="14" y="26" fill="#D4D0C8" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">human review</text>
        <text x="14" y="48" fill="#5C5852" font-size="13">deny · unsure · fail</text>
      </g>
    </g>

    <!-- three switches -->
    <g transform="translate(18 148)">
      <text x="0" y="0" fill="#5C5852" font-size="11" letter-spacing="1.4">SWITCHES · DEFAULT OFF</text>
      <g transform="translate(0 12)">
        <rect width="136" height="42" rx="8" fill="#0B0B0C" stroke="#3A3836"/>
        <text x="12" y="16" fill="#8A857C" font-size="11">GATE</text>
        <rect x="12" y="22" width="34" height="12" rx="6" fill="#2E2C2A"/>
        <circle cx="18" cy="28" r="4.5" fill="#8A857C"/>
        <text x="54" y="32" fill="#5C5852" font-size="12">OFF</text>
      </g>
      <g transform="translate(148 12)">
        <rect width="136" height="42" rx="8" fill="#0B0B0C" stroke="#3A3836"/>
        <text x="12" y="16" fill="#8A857C" font-size="11">ROUTE</text>
        <rect x="12" y="22" width="34" height="12" rx="6" fill="#2E2C2A"/>
        <circle cx="18" cy="28" r="4.5" fill="#8A857C"/>
        <text x="54" y="32" fill="#5C5852" font-size="12">OFF</text>
      </g>
      <g transform="translate(296 12)">
        <rect width="128" height="42" rx="8" fill="#0B0B0C" stroke="#3A3836"/>
        <text x="10" y="16" fill="#8A857C" font-size="11">TRIM/CMP</text>
        <rect x="10" y="22" width="34" height="12" rx="6" fill="#2E2C2A"/>
        <circle cx="16" cy="28" r="4.5" fill="#8A857C"/>
        <text x="52" y="32" fill="#5C5852" font-size="12">OFF</text>
      </g>
    </g>

    <!-- proxy hop strip -->
    <g transform="translate(18 220)">
      <text x="0" y="0" fill="#5C5852" font-size="11" letter-spacing="1.4">OPTIONAL PROXY HOP</text>
      <g transform="translate(0 10)">
        <rect width="424" height="34" rx="8" fill="#0B0B0C" stroke="#2E2C2A"/>
        <text x="12" y="22" fill="#D4D0C8" font-size="12">CC</text>
        <text x="40" y="22" fill="#5C5852" font-size="12">></text>
        <text x="58" y="22" fill="#F4F1EA" font-size="12">:8787</text>
        <text x="108" y="22" fill="#5C5852" font-size="12">></text>
        <text x="126" y="22" fill="#D4D0C8" font-size="12">route</text>
        <text x="170" y="22" fill="#5C5852" font-size="12">></text>
        <text x="188" y="22" fill="#D4D0C8" font-size="12">trim/cmp</text>
        <text x="268" y="22" fill="#5C5852" font-size="12">></text>
        <text x="286" y="22" fill="#F4F1EA" font-size="12">upstream</text>
        <text x="360" y="22" fill="#5C5852" font-size="11">fail-open</text>
      </g>
    </g>
  </g>
</svg>
