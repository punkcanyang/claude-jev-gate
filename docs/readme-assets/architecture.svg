<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
  <title id="t">claude-jev-gate architecture — tool gate and local proxy</title>
  <desc id="d">Two independent paths: PermissionRequest tool gate (allow once or human review), and optional local Anthropic-compatible proxy that can Jev-route then trim-then-compress before upstream.</desc>

  <rect width="1200" height="540" rx="24" fill="#0B0B0C"/>
  <rect x="0" y="0" width="6" height="540" fill="#F4F1EA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <text x="48" y="40" fill="#8A857C" font-size="13" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ARCHITECTURE · TWO PATHS · v0.2.1</text>

    <!-- PATH A -->
    <text x="48" y="76" fill="#F4F1EA" font-size="18" font-weight="600" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">A · 工具闸（PermissionRequest hook）</text>

    <g transform="translate(48 94)">
      <rect width="188" height="96" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">Claude Code</text>
      <text x="18" y="64" fill="#8A857C" font-size="15">tool call</text>
    </g>
    <text x="252" y="150" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(284 94)">
      <rect width="236" height="96" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="18" y="32" fill="#F4F1EA" font-size="17" font-weight="600">PermissionRequest</text>
      <text x="18" y="58" fill="#D4D0C8" font-size="15">Jev approve?</text>
      <text x="18" y="82" fill="#8A857C" font-size="14">GATE · default OFF</text>
    </g>
    <text x="536" y="150" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(568 94)">
      <rect width="208" height="96" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">allow once</text>
      <text x="18" y="64" fill="#8A857C" font-size="15">high-conf only</text>
    </g>
    <text x="792" y="150" fill="#5C5852" font-size="22">/</text>
    <g transform="translate(816 94)">
      <rect width="336" height="96" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="18" y="36" fill="#D4D0C8" font-size="18" font-weight="600">human review</text>
      <text x="18" y="64" fill="#5C5852" font-size="15">deny · unsure · timeout · error</text>
    </g>

    <!-- PATH B -->
    <text x="48" y="244" fill="#F4F1EA" font-size="18" font-weight="600" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">B · 本机代理（可选 · ANTHROPIC_BASE_URL）</text>

    <g transform="translate(48 262)">
      <rect width="168" height="108" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="16" y="34" fill="#F4F1EA" font-size="17" font-weight="600">Claude Code</text>
      <text x="16" y="60" fill="#8A857C" font-size="15">Messages</text>
      <text x="16" y="86" fill="#5C5852" font-size="14">BASE_URL</text>
    </g>
    <text x="232" y="324" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(260 262)">
      <rect width="168" height="108" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="16" y="34" fill="#F4F1EA" font-size="17" font-weight="600">local proxy</text>
      <text x="16" y="60" fill="#D4D0C8" font-size="15">:8787</text>
      <text x="16" y="86" fill="#8A857C" font-size="14">Anthropic-compat</text>
    </g>
    <text x="444" y="324" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(472 262)">
      <rect width="176" height="108" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="14" y="34" fill="#F4F1EA" font-size="17" font-weight="600">Jev route</text>
      <text x="14" y="60" fill="#D4D0C8" font-size="15">Choice -> model</text>
      <text x="14" y="86" fill="#8A857C" font-size="14">fail-open client</text>
    </g>
    <text x="664" y="324" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(692 262)">
      <rect width="176" height="108" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="14" y="34" fill="#F4F1EA" font-size="16" font-weight="600">trim->compress</text>
      <text x="14" y="60" fill="#D4D0C8" font-size="15">order forced</text>
      <text x="14" y="86" fill="#8A857C" font-size="14">local stub</text>
    </g>
    <text x="884" y="324" fill="#8A857C" font-size="26">→</text>
    <g transform="translate(912 262)">
      <rect width="240" height="108" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="16" y="34" fill="#F4F1EA" font-size="17" font-weight="600">upstream</text>
      <text x="16" y="60" fill="#D4D0C8" font-size="15">DeepSeek / Anthropic</text>
      <text x="16" y="86" fill="#8A857C" font-size="14">key-by-host · SSE</text>
    </g>

    <!-- footer notes -->
    <line x1="48" y1="404" x2="1152" y2="404" stroke="#2E2C2A" stroke-width="1"/>
    <text x="48" y="436" fill="#8A857C" font-size="15" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">两条路径彼此独立 · 三开关默认全关 · 关路由／裁压时代理透明转发</text>
    <text x="48" y="468" fill="#5C5852" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prove_gate 15 · prove_routing >=20 · prove_trim_compress · prove_proxy · CI live</text>
    <text x="48" y="498" fill="#3A3836" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.github/workflows/prove.yml · no Gateway · mock needs ALLOW_MOCK · compress = stub</text>
  </g>
</svg>
