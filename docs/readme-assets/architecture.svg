<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">claude-jev-gate architecture</title>
  <desc id="d">Claude Code PermissionRequest gate path and optional local Anthropic proxy path: Jev route, trim then compress, upstream DeepSeek.</desc>

  <rect width="1200" height="520" rx="24" fill="#0B0B0C"/>
  <rect x="0" y="0" width="6" height="520" fill="#F4F1EA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
    <text x="48" y="42" fill="#8A857C" font-size="14" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ARCHITECTURE · TWO PATHS</text>

    <!-- PATH A -->
    <text x="48" y="78" fill="#F4F1EA" font-size="18" font-weight="600" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">A · 工具闸（PermissionRequest）</text>

    <g transform="translate(48 96)">
      <rect width="200" height="100" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="20" y="38" fill="#F4F1EA" font-size="20" font-weight="600">Claude Code</text>
      <text x="20" y="68" fill="#8A857C" font-size="15">tool call</text>
    </g>

    <text x="268" y="154" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(300 96)">
      <rect width="240" height="100" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="20" y="34" fill="#F4F1EA" font-size="18" font-weight="600">PermissionRequest</text>
      <text x="20" y="60" fill="#D4D0C8" font-size="15">Jev approve?</text>
      <text x="20" y="84" fill="#8A857C" font-size="14">GATE switch</text>
    </g>

    <text x="560" y="154" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(592 96)">
      <rect width="220" height="100" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="20" y="38" fill="#F4F1EA" font-size="20" font-weight="600">allow once</text>
      <text x="20" y="68" fill="#8A857C" font-size="15">high-conf only</text>
    </g>

    <text x="830" y="154" fill="#5C5852" font-size="22">/</text>

    <g transform="translate(858 96)">
      <rect width="294" height="100" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="20" y="38" fill="#D4D0C8" font-size="20" font-weight="600">human review</text>
      <text x="20" y="68" fill="#5C5852" font-size="15">deny · unsure · timeout</text>
    </g>

    <!-- PATH B -->
    <text x="48" y="248" fill="#F4F1EA" font-size="18" font-weight="600" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">B · 本机代理（可选 · ANTHROPIC_BASE_URL）</text>

    <g transform="translate(48 266)">
      <rect width="180" height="110" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">Claude Code</text>
      <text x="18" y="64" fill="#8A857C" font-size="15">Messages</text>
      <text x="18" y="90" fill="#5C5852" font-size="14">BASE_URL</text>
    </g>

    <text x="244" y="328" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(276 266)">
      <rect width="180" height="110" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">local proxy</text>
      <text x="18" y="64" fill="#D4D0C8" font-size="15">:8787</text>
      <text x="18" y="90" fill="#8A857C" font-size="14">Anthropic-compat</text>
    </g>

    <text x="472" y="328" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(504 266)">
      <rect width="180" height="110" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">Jev route</text>
      <text x="18" y="64" fill="#D4D0C8" font-size="15">Choice → model</text>
      <text x="18" y="90" fill="#8A857C" font-size="14">ROUTE · fail-open</text>
    </g>

    <text x="700" y="328" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(732 266)">
      <rect width="180" height="110" rx="12" fill="#161514" stroke="#3A3836"/>
      <text x="18" y="36" fill="#F4F1EA" font-size="18" font-weight="600">trim→compress</text>
      <text x="18" y="64" fill="#D4D0C8" font-size="15">order forced</text>
      <text x="18" y="90" fill="#8A857C" font-size="14">TRIM switch</text>
    </g>

    <text x="928" y="328" fill="#8A857C" font-size="28">→</text>

    <g transform="translate(960 266)">
      <rect width="192" height="110" rx="12" fill="#161514" stroke="#F4F1EA" stroke-width="1.5"/>
      <text x="16" y="36" fill="#F4F1EA" font-size="18" font-weight="600">upstream</text>
      <text x="16" y="64" fill="#D4D0C8" font-size="15">DeepSeek</text>
      <text x="16" y="90" fill="#8A857C" font-size="14">Anthropic API</text>
    </g>

    <text x="48" y="430" fill="#5C5852" font-size="15" font-family="'Noto Sans CJK SC', 'PingFang SC', sans-serif">两条路径彼此独立 · 三开关默认全关 · 关路由／裁压时代理透明转发</text>
    <text x="48" y="460" fill="#5C5852" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prove_gate 13/13 · prove_routing ≥20 · prove_trim_compress order_ok · demo_proxy_curl</text>
    <text x="48" y="492" fill="#3A3836" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">no hard-ban · no Gateway · compress = local stub</text>
  </g>
</svg>
